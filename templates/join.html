{% extends "base.html" %}
{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/join.css') }}">
<style>
/* ======== ESTILOS ACTUALIZADOS ======== */
.join-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 85vh;
  background: linear-gradient(135deg, #fff8e1 0%, #ffe0b2 100%);
  position: relative;
  overflow: hidden;
}

.join-card {
  background: #ffffff;
  border-radius: 16px;
  padding: 2.5rem 2rem;
  box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
  text-align: center;
  width: min(420px, 90%);
  z-index: 2;
}

.join-icon {
  color: #ff9800;
  margin-bottom: 1rem;
}

.join-card h2 {
  margin: 0;
  font-size: 1.8rem;
  color: #333;
  font-weight: 700;
}

.join-subtitle {
  font-size: 1rem;
  color: #555;
  margin-bottom: 1.8rem;
}

.pin-input-group {
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
}

.pin-code-input {
  width: 100%;
  padding: 0.9rem 1rem;
  border: 2px solid #d1d5db;
  border-radius: 10px;
  font-size: 1rem;
  text-align: center;
  letter-spacing: 2px;
  transition: all 0.2s ease;
}

.pin-code-input:focus {
  border-color: #ff9800;
  box-shadow: 0 0 0 3px rgba(255,152,0,0.2);
  outline: none;
}

.btn-unir {
  background: linear-gradient(135deg, #ffb300, #ff9800);
  border: none;
  color: #fff;
  padding: 0.9rem 1rem;
  border-radius: 10px;
  font-weight: 600;
  font-size: 1.05rem;
  cursor: pointer;
  transition: all 0.25s ease;
}

.btn-unir:hover {
  background: linear-gradient(135deg, #ffa000, #fb8c00);
  transform: translateY(-2px);
}

.btn-unir:active {
  transform: translateY(0);
}

.error-message {
  margin-top: 1rem;
  color: #e53935;
  font-weight: 500;
}

.hidden {
  display: none;
}

.join-footer {
  margin-top: 1.8rem;
  font-size: 0.95rem;
}

.join-footer a {
  color: #ff9800;
  font-weight: 600;
  text-decoration: none;
}

.join-footer a:hover {
  text-decoration: underline;
}

.curve {
  position: absolute;
  bottom: 0;
  width: 100%;
  line-height: 0;
}
.curve svg {
  position: relative;
  display: block;
  width: calc(100% + 1.3px);
  height: 150px;
}
.curve .shape-fill {
  fill: #ffffff;
}
</style>
{% endblock %}

{% block content %}
<main class="join-section">
  <div class="join-card">
    <div class="join-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    </div>
    <h2>Unirse a un Cuestionario o Sala</h2>
    <p class="join-subtitle">Ingresa el código PIN de cuestionario o código de sala grupal</p>
    
    <form id="joinForm" class="join-form" onsubmit="return joinGame(event)">
      <div class="pin-input-group">
        <input 
          type="text" 
          id="pinInput" 
          class="pin-code-input" 
          placeholder="PIN o Código de Sala" 
          maxlength="10" 
          autocomplete="off" 
          required
        >
        <button type="submit" class="btn-unir">Unirse</button>
      </div>
      <div id="errorMessage" class="error-message hidden"></div>
    </form>

    <div class="join-footer">
      <p>¿Quieres resolver en equipo? <a href="/grupos">Crea o únete a un grupo</a></p>
    </div>
  </div>

  <div class="curve" aria-hidden="true">
    <svg data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
      <path d="M0,50 C400,150 800,0 1200,80 L1200,120 L0,120 Z" class="shape-fill"></path>
    </svg>
  </div>
</main>
{% endblock %}

{% block page_js %}
<script>
function joinGame(event) {
  event.preventDefault();
  const code = document.getElementById("pinInput").value.trim().toUpperCase();
  const errorBox = document.getElementById("errorMessage");

  if (!code || code.length < 4) {
    errorBox.textContent = "Por favor, ingresa un código válido.";
    errorBox.classList.remove("hidden");
    return false;
  }

  // Si el código tiene 6 caracteres, intentar unirse a sesión de grupo
  if (code.length === 6) {
    joinGroupSession(code, errorBox);
  } else {
    // PIN de cuestionario individual
    window.location.href = `/cuestionario/${code}/espera`;
  }
  return false;
}

async function joinGroupSession(sessionCode, errorBox) {
  try {
    const response = await fetch('/api/grupo/unirse-sesion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_code: sessionCode })
    });

    const result = await response.json();

    if (result.success) {
      // Redirigir a la página de la sesión del grupo
      window.location.href = `/grupo/quiz/${result.sesion_id}`;
    } else {
      errorBox.textContent = result.message || 'Código de sala inválido o no tienes acceso';
      errorBox.classList.remove("hidden");
    }
  } catch (error) {
    errorBox.textContent = 'Error de conexión. Intenta nuevamente.';
    errorBox.classList.remove("hidden");
  }
}
</script>
{% endblock %}
