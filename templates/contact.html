{% extends "base.html" %}
{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">{% endblock %}
{% block content %}
<main class="page-main contact-page">
    <section class="hero-section" style="z-index: -1;">
        <div class="curve" >
                <svg data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
                    <path d="M1293 0V129H-3V5C134 63 205 51 325 44 382 40 540 28 626 33 827 53 959 52 1028 54 1124 44 1113 49 1253 11Z" class="shape-fill"></path>
                </svg>
            </div>
    </section>
    <div class="container contact-container">

        <h2 class="contact-title">Contáctanos</h2>
        <p class="contact-text">
            Si tienes alguna pregunta o comentario, completa el siguiente formulario y te responderemos lo antes
            posible.
        </p>

        <form action="/enviar_contacto" method="POST" class="contact-form">

            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" class="pill-input" placeholder="Ingresa tu nombre"
                    required>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" class="pill-input" placeholder="ejemplo@correo.com"
                    required>
            </div>

            <div class="form-group">
                <label for="asunto">Asunto</label>
                <input type="text" id="asunto" name="asunto" class="pill-input" placeholder="Motivo del mensaje"
                    required>
            </div>

            <div class="form-group">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="5" class="pill-input"
                    placeholder="Escribe tu mensaje aquí..." required></textarea>
            </div>

            <button type="submit" class="btn-wide btn-contact">
                Enviar mensaje
            </button>

        </form>

    </div>
</main>
{% endblock %}
{% block page_js %}
<script src="{{ url_for('static', filename='js/home.js') }}"></script>{% endblock %}
