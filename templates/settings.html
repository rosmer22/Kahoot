
{% extends "base.html" %}
{% block page_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/settings.css') }}">{% endblock %}
{% block content %}
<section class="settings-hero">
  <h1>Configuracion</h1>
  <div class="curve">
    <svg data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
      <path d="M0,50 C400,150 800,0 1200,80 L1200,120 L0,120 Z" class="shape-fill"></path>
    </svg>
  </div>
</section>

<main class="settings-container">
  <!-- Tarjeta de Perfil -->
  <section class="card profile-card">
    <h2 class="card-title">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span>Perfil</span>
    </h2>
    <div class="info-field" onclick="editUsername()">
      <div>
        <span class="field-label">Nombre de Usuario</span>
        <span class="field-value" id="username-display">{{ user.username if user else '' }}</span>
        <input type="text" id="username" class="field-input" value="{{ user.username if user else '' }}" style="display: none;">
      </div>
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </div>
    <div class="info-field" onclick="editEmail()">
      <div>
        <span class="field-label">Direccion de correo Electronico</span>
        <span class="field-value" id="email-display">{{ user.email if user else '' }}</span>
        <input type="email" id="email" class="field-input" value="{{ user.email if user else '' }}" style="display: none;">
      </div>
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </div>
    <button id="saveProfileBtn" class="btn-save" style="display: none;" onclick="saveProfile()">Guardar Cambios</button>
  </section>

  <!-- Tarjeta de Contraseña -->
  <section class="card password-card">
    <h2 class="card-title">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <span>Cambiar contraseña</span>
    </h2>
    <form id="passwordForm" onsubmit="return changePassword(event)">
      <div class="form-grid">
        <div class="input-container full-width">
          <label for="oldPassword">Contraseña Anterior</label>
          <div class="password-wrapper">
            <input type="password" id="oldPassword" name="old_password" required>
            <span class="toggle-password" onclick="togglePassword('oldPassword')">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </span>
          </div>
        </div>
        <div class="input-container">
          <label for="newPassword">Nueva Contraseña</label>
          <div class="password-wrapper">
            <input type="password" id="newPassword" name="new_password" required minlength="6">
            <span class="toggle-password" onclick="togglePassword('newPassword')">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </span>
          </div>
        </div>
        <div class="input-container">
          <label for="confirmPassword">Repite la Nueva Contraseña</label>
          <div class="password-wrapper">
            <input type="password" id="confirmPassword" name="confirm_password" required minlength="6">
            <span class="toggle-password" onclick="togglePassword('confirmPassword')">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </span>
          </div>
        </div>
      </div>
      <button type="submit" class="btn-save">Guardar</button>
    </form>
  </section>

  <button class="btn-logout" data-logout-url="{{ url_for('logout') }}">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
      <polyline points="16 17 21 12 16 7"></polyline>
      <line x1="21" y1="12" x2="9" y2="12"></line>
    </svg>
    <span>Cerrar Sesion</span>
  </button>

  <button class="btn-delete" data-delete-url="{{ url_for('delete_account') }}">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
      <polyline points="16 17 21 12 16 7"></polyline>
      <line x1="21" y1="12" x2="9" y2="12"></line>
    </svg>
    <span>Eliminar Cuenta</span>
  </button>
</main>

{% endblock %}
{% block page_js %}<script src="{{ url_for('static', filename='js/settings.js') }}"></script>{% endblock %}
