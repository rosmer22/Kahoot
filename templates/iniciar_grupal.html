<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciando Cuestionario - RoBot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .loading-container {
            background: white;
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        h1 {
            color: #333;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }
        
        p {
            color: #666;
            margin-bottom: 0;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <h1>🚀 Iniciando Cuestionario</h1>
        <p>Creando sala de grupo...</p>
        <div class="error" id="errorMessage"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const cuestionarioId = {{ cuestionario_id }};
            const errorMessage = document.getElementById('errorMessage');
            
            // Llamar a la API para crear la sesión
            fetch('/api/cuestionario/iniciar-grupal', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    cuestionario_id: cuestionarioId
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Redirigir a la página de grupo quiz
                    window.location.href = `/grupo/quiz/${data.sesion_id}`;
                } else {
                    // Mostrar error
                    errorMessage.textContent = data.message || 'Error al iniciar el cuestionario';
                    errorMessage.style.display = 'block';
                }
            })
            .catch(error => {
                // Mostrar error de conexión
                errorMessage.textContent = 'Error de conexión. Inténtalo de nuevo.';
                errorMessage.style.display = 'block';
            });
        });
    </script>
</body>
</html>
