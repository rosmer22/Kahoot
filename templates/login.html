
{% extends "base.html" %}
{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
<style>
    /* Estilos para el botón de mostrar/ocultar contraseña */
    .password-wrapper {
        position: relative;
        width: 100%;
    }

    .password-wrapper .input {
        width: 100%;
        /* Asegura que el input ocupe todo el espacio del wrapper */
        padding-right: 3rem;
        /* Espacio para el botón */
    }

    .toggle-password {
        position: absolute;
        right: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #666;
        background: none;
        border: none;
        padding: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
    }
</style>
{% endblock %}
{% block content %}
<main class="login-section">
    <div class="auth-card">
        <h2>Iniciar Sesion</h2>
        <form class="auth-form" method="post">
            <div class="field">
                <label class="label" for="email">Direccion de correo Electronico</label>
                <input class="input" id="email" name="email" type="email" required>
            </div>
            <div class="field">
                <label class="label" for="password">Contraseña</label>
                <div class="password-wrapper">
                    <input class="input" id="password" name="password" type="password" required>
                    <span class="toggle-password" onclick="togglePassword('password')">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                            </path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </span>
                </div>
            </div>
            <div class="remember-field">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Recordar</label>
            </div>
            <div class="forgot-password">
                <a href="{{ url_for('recuperar_cuenta') }}">¿Has olvidado tu contraseña?</a>
            </div>
            <button class="submit-btn" type="submit">Entrar</button>
        </form>
        <p class="helper-text">¿No tienes una cuenta? <a href="{{ url_for('register') }}">Regístrate</a></p>
    </div>
    <div class="curve" aria-hidden="true">
        <svg data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,50 C400,150 800,0 1200,80 L1200,120 L0,120 Z" class="shape-fill"></path>
        </svg>
    </div>
</main>
{% endblock %}
{% block page_js %}
<script>
    function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        const button = input.parentElement.querySelector('.toggle-password');
        const svg = button.querySelector('svg');

        if (input.type === 'password') {
            input.type = 'text';
            // Cambiar a icono de ojo abierto
            svg.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
        } else {
            input.type = 'password';
            // Cambiar a icono de ojo cerrado (original)
            svg.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
        }
    }
</script>
{% endblock %}
