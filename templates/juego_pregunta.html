{% extends "base.html" %}
{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/juego_pregunta.css') }}">
{% endblock %}

{% block content %}
<main class="game-container">
    <header class="game-header">
        <div class="question-counter" id="question-counter">
            Pregunta {{ num_pregunta }} de {{ preguntas|length }}
        </div>
        <div class="score-display">
            Puntaje: <span id="score-value">{{ puntaje_inicial }}</span>
        </div>
        <div class="timer-display">
            Tiempo: <span id="timer-value">{{ tiempo_limite }}</span>s
        </div>
    </header>

    <div class="question-area">
        <h2 class="question-text" id="question-text">Cargando pregunta...</h2>
    </div>

    <div class="options-grid" id="options-container">
        <!-- Las opciones se cargarán aquí por JS -->
    </div>

    <div class="feedback" id="feedback" style="display: none;"></div>

    <div class="next-question-container">
        <button id="next-question-btn" class="btn-next" style="display: none;">Siguiente →</button>
    </div>

</main>
{% endblock %}

{% block page_js %}
<script>
    const pin = "{{ pin }}";
    const preguntas = {{ preguntas_json | tojson | safe }};
    const num_pregunta = {{ num_pregunta }};
    const puntaje_inicial = {{ puntaje_inicial }};
</script>
<script src="{{ url_for('static', filename='js/juego_pregunta.js') }}"></script>
{% endblock %}
