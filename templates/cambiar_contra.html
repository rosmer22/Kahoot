{% extends "base.html" %}
{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
<style>
    :root {
        --color-secundario-amarillo: #ffd36a;
        --color-fondo-claro: #f0f0f0;
        --color-texto: #333333;
        --color-gris-claro-tarjeta: #e9e9e9;
        --color-borde-input: #b8b8b8;
    }

    .change-password-section {
        background-color: var(--color-secundario-amarillo);
        flex-grow: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 4rem 2rem;
        position: relative;
        overflow: hidden;
    }

    .auth-card {
        background-color: var(--color-gris-claro-tarjeta);
        padding: 2.5rem 3rem;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 480px;
        z-index: 1;
        border: 1px solid #ddd;
    }

    .auth-card h2 {
        text-align: center;
        font-size: 2.2rem;
        font-weight: 600;
        margin-top: 0;
        margin-bottom: 0.5rem;
        color: var(--color-texto);
    }

    .auth-card .subtitle {
        color: #666;
        margin-bottom: 2.5rem;
        font-size: 1.1rem;
        text-align: center;
    }

    .auth-form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }

    .auth-form .label {
        display: block;
        margin-bottom: 0.75rem;
        font-weight: 500;
        color: #555;
        font-size: 1.1rem;
    }

    .password-wrapper {
        position: relative;
        width: 100%;
    }

    .password-wrapper .input {
        width: 100%;
        padding: 1rem;
        padding-right: 3rem;
        border: 2px solid #e1e5e9;
        background-color: #fff;
        border-radius: 12px;
        font-size: 1rem;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .password-wrapper .input:focus {
        outline: none;
        border-color: #ffd36a;
        box-shadow: 0 0 0 3px rgba(255,211,106,0.2);
    }

    .toggle-password {
        position: absolute;
        right: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #666;
        background: none;
        border: none;
        padding: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .toggle-password:hover { color: #333; }

    /* Feedback de contraseña (solo texto negro) */
    .password-feedback {
        color: #000;
        font-size: 0.9rem;
        margin-top: 0.3rem;
        transition: all 0.3s ease;
    }
    .password-feedback ul {
        margin: 0.3rem 0 0 1.2rem;
        padding: 0;
        list-style-type: disc;
    }

    /* Botón cambiar contraseña */
    .submit-btn {
        width: 100%;
        padding: 1.2rem 2rem;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #ffeb9a 0%, #ffd36a 100%);
        color: #333;
        font-size: 1.2rem;
        font-weight: 600;
        cursor: not-allowed;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(255,211,106,0.4);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-top: 1rem;
    }

    .submit-btn.enabled {
        cursor: pointer;
    }

    .submit-btn.enabled:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255,211,106,0.6);
        background: linear-gradient(135deg, #ffe27c 0%, #e2b957 100%);
    }

    .helper-text {
        text-align: center;
        margin-top: 2rem;
        color: #666;
    }

    .helper-text a {
        color: #667eea;
        text-decoration: none;
        font-weight: 500;
    }

    .helper-text a:hover { text-decoration: underline; }

    .change-password-section .curve {
        position: absolute;
        bottom: -1px;
        left: 0;
        width: 100%;
        overflow: hidden;
        line-height: 0;
    }

    .change-password-section .curve .shape-fill {
        fill: var(--color-fondo-claro);
    }
</style>
{% endblock %}

{% block content %}
<main class="change-password-section">
    <div class="auth-card">
        <h2>Cambiar Contraseña</h2>
        <p class="subtitle">Ingresa tu nueva contraseña para continuar</p>

        {% if mensaje %}
        <div class="error-message">
            <span class="error-icon">⚠️</span>
            {{ mensaje }}
        </div>
        {% endif %}

        <form class="auth-form" method="post" action="{{ url_for('cambiar_contrasena') }}" id="changePasswordForm">
            <div class="field">
                <label class="label" for="new-password">Nueva Contraseña*</label>
                <div class="password-wrapper">
                    <input class="input" id="new-password" name="new-password" type="password" required minlength="8">
                    <span class="toggle-password" onclick="togglePassword('new-password')">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </span>
                </div>
                <div id="newFeedback" class="password-feedback"></div>
            </div>

            <div class="field">
                <label class="label" for="confirm-password">Confirmar Contraseña*</label>
                <div class="password-wrapper">
                    <input class="input" id="confirm-password" name="confirm-password" type="password" required minlength="8">
                    <span class="toggle-password" onclick="togglePassword('confirm-password')">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </span>
                </div>
                <div id="confirmFeedback" class="password-feedback"></div>
            </div>

            <button class="submit-btn" type="submit" disabled>🔒 Cambiar Contraseña</button>
        </form>

        <p class="helper-text">¿Recordaste tu contraseña? <a href="{{ url_for('login') }}">Iniciar sesión</a></p>
    </div>

    <div class="curve" aria-hidden="true">
        <svg data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,50 C400,150 800,0 1200,80 L1200,120 L0,120 Z" class="shape-fill"></path>
        </svg>
    </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const newPass = document.getElementById('new-password');
    const confirmPass = document.getElementById('confirm-password');
    const newFeedback = document.getElementById('newFeedback');
    const confirmFeedback = document.getElementById('confirmFeedback');
    const submitBtn = document.querySelector('.submit-btn');

    const rules = [
        { text: 'Mínimo 8 caracteres', test: p => /^.{8,}$/.test(p) },
        { text: 'Al menos 1 mayúscula (A–Z)', test: p => /[A-Z]/.test(p) },
        { text: 'Al menos 1 minúscula (a–z)', test: p => /[a-z]/.test(p) },
        { text: 'Al menos 1 carácter especial (!@#$%^&*)', test: p => /[^A-Za-z0-9]/.test(p) },
    ];

    function renderFeedback(pwdVal, feedbackBox) {
        const missing = rules.filter(r => !r.test(pwdVal));
        if (missing.length === 0) {
            feedbackBox.innerHTML = '';
            return true;
        }
        let html = '<ul>';
        missing.forEach(r => html += `<li>${r.text}</li>`);
        html += '</ul>';
        feedbackBox.innerHTML = html;
        return false;
    }

    function validateBoth() {
        const newOK = renderFeedback(newPass.value, newFeedback);
        const passwordsMatch = newPass.value && confirmPass.value && newPass.value === confirmPass.value;

        if (!passwordsMatch && confirmPass.value !== '') {
            confirmFeedback.innerHTML = '<ul><li>Las contraseñas no coinciden</li></ul>';
        } else {
            confirmFeedback.innerHTML = '';
        }

        // Habilitar si ambas condiciones se cumplen
        if (newOK && passwordsMatch) {
            submitBtn.disabled = false;
            submitBtn.classList.add('enabled');
        } else {
            submitBtn.disabled = true;
            submitBtn.classList.remove('enabled');
        }
    }

    newPass.addEventListener('input', validateBoth);
    confirmPass.addEventListener('input', validateBoth);
    submitBtn.disabled = true;
});

function togglePassword(id) {
    const input = document.getElementById(id);
    const svg = input.parentElement.querySelector('svg');
    if (input.type === 'password') {
        input.type = 'text';
        svg.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
    } else {
        input.type = 'password';
        svg.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
    }
}
</script>
{% endblock %}
