<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados RoBot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/resultado.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Resultados RoBot</h1>
            <div class="summary-chips">
                <span class="chip">Total Preguntas: <strong id="total-preguntas"></strong></span>
                <span class="chip">Participantes: <strong id="total-participantes"></strong></span>
                <span class="chip">Tiempo Total: <strong id="tiempo-total"></strong></span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="global-progress"></div>
                <span id="global-progress-text"></span>
            </div>
        </header>

        <main>
            <section class="leaderboard-section">
                <h2>🏆 Ranking General</h2>
                <div id="leaderboard"></div>
            </section>

            <section class="heatmap-section">
                <h2>📊 Tablero por Pregunta</h2>
                <div class="heatmap-container">
                    <div id="heatmap"></div>
                </div>
            </section>

            <section class="details-section">
                <h2>🔍 Detalles por Usuario</h2>
                <div id="user-details-accordion"></div>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/resultado.js') }}"></script>
</body>
</html>
